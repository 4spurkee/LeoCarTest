<!DOCTYPE html>
<html lang="uk">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LEO COMMAND</title>

<style>
:root{
    --bg1:#3b4a1f;
    --bg2:#1f2a12;

    --panel:#1f2a12;
    --panel2:#2f3a17;

    --glass:rgba(25,35,12,.92);

    --text:#f3e7b3;

    --accent:#d6b65a;
    --accent2:#ffe08a;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:linear-gradient(135deg,var(--bg1),var(--bg2));
    color:var(--text);
    font-family:'Trebuchet MS',sans-serif;
    min-height:100vh;
}

/* HEADER */

.top-bar{
    position:fixed;
    top:0;
    left:0;
    width:100%;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:18px 25px;

    background:var(--glass);
    backdrop-filter:blur(10px);

    border-bottom:1px solid var(--accent);

    z-index:1000;
}

.brand h1{
    font-size:32px;

    background:linear-gradient(
        90deg,
        #ffde84,
        #f9dd8a
    );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.brand span{
    font-size:13px;
    color:var(--text);
    opacity:.8;
}

/* LAYOUT */

.main-layout{
    display:flex;
    min-height:100vh;
    padding-top:95px;
}

/* LEFT */

.left-panel{
    width:40%;
    padding:20px;

    display:flex;
    flex-direction:column;
    gap:15px;
}

/* RIGHT */

.right-panel{
    width:60%;

    display:flex;
    justify-content:center;
    align-items:center;
}

/* CARDS */

.card{
    background:linear-gradient(
        135deg,
        var(--panel2),
        var(--panel)
    );

    border:1px solid var(--accent);

    border-radius:14px;

    padding:15px;
}

.card h2{
    margin-bottom:10px;
}

/* BUTTONS */

button{
    cursor:pointer;

    border:2px solid var(--accent);

    background:var(--panel);

    color:var(--text);

    border-radius:10px;

    padding:10px 15px;

    transition:.2s;
}

button:hover{
    border-color:var(--accent2);
    transform:translateY(-2px);
}

#serialBtn{
    font-size:16px;
}

/* RANGE */

input[type="range"]{
    width:100%;
}

/* LOG */

#log{
    height:300px;
    overflow-y:auto;

    font-family:monospace;

    border:1px solid var(--accent);

    border-radius:10px;

    padding:10px;

    background:rgba(0,0,0,.15);
}

/* CONTROL PAD */

.controls{
    display:grid;

    grid-template-areas:
        ". up ."
        "left stop right"
        ". down .";

    gap:15px;
}

.controls button{
    width:110px;
    height:110px;

    font-size:38px;
    font-weight:bold;

    border:none;

    border-radius:20px;

    color:#222;

    background:linear-gradient(
        135deg,
        var(--accent),
        var(--accent2)
    );

    box-shadow:0 5px 15px rgba(0,0,0,.3);
}

.controls button:hover{
    transform:scale(1.05);
}

button[data-dir="up"]{
    grid-area:up;
}

button[data-dir="left"]{
    grid-area:left;
}

button[data-dir="right"]{
    grid-area:right;
}

button[data-dir="down"]{
    grid-area:down;
}

button[data-dir="stop"]{
    grid-area:stop;
}

/* MOBILE */

@media(max-width:900px){

    .main-layout{
        flex-direction:column;
    }

    .left-panel{
        width:100%;
    }

    .right-panel{
        width:100%;
        padding:20px;
    }

    .controls button{
        width:80px;
        height:80px;
        font-size:28px;
    }
}
</style>
</head>

<body>

<header class="top-bar">

    <div class="brand">
        <h1>LEO COMMAND</h1>
        <span>ESP32 Robot Control Center</span>
    </div>

    <button id="serialBtn" onclick="connectSerial()">
        Connect Serial
    </button>

</header>

<div class="main-layout">

    <div class="left-panel">

        <div class="card">

            <h2>🔌 Connection</h2>

            <button onclick="connectSerial()">
                Connect ESP32
            </button>

        </div>

        <div class="card">

            <h2>⚡ Speed</h2>

            <input
                type="range"
                min="0"
                max="9"
                value="5"
                onchange="sendCommand(this.value)">

        </div>

        <div class="card">

            <h2>📜 Log</h2>

            <div id="log">
                LEO COMMAND READY
            </div>

        </div>

    </div>

    <div class="right-panel">

        <div class="controls">

            <button
                data-dir="up"
                onclick="sendCommand('F')">
                ↑
            </button>

            <button
                data-dir="left"
                onclick="sendCommand('L')">
                ←
            </button>

            <button
                data-dir="stop"
                onclick="sendCommand('S')">
                ■
            </button>

            <button
                data-dir="right"
                onclick="sendCommand('R')">
                →
            </button>

            <button
                data-dir="down"
                onclick="sendCommand('B')">
                ↓
            </button>

        </div>

    </div>

</div>

<script>
let serialWriter = null;
let serialReader = null;

const encoder = new TextEncoder();
const decoder = new TextDecoder();

function log(message){

    const logBox = document.getElementById("log");

    logBox.innerHTML =
        message +
        "<br>" +
        logBox.innerHTML;

    console.log(message);
}

async function connectSerial(){

    try{

        const port =
            await navigator.serial.requestPort();

        await port.open({
            baudRate:9600
        });

        serialWriter =
            port.writable.getWriter();

        serialReader =
            port.readable.getReader();

        log("✅ Connected");

        while(true){

            const {
                value,
                done
            } = await serialReader.read();

            if(done)
                break;

            if(value){

                const text =
                    decoder.decode(value);

                log("📥 " + text.trim());
            }
        }

    }
    catch(err){

        log("❌ " + err);
    }
}

async function sendCommand(cmd){

    if(!serialWriter){

        log("⚠️ Not Connected");
        return;
    }

    try{

        await serialWriter.write(
            encoder.encode(cmd + "\n")
        );

        log("➡️ Sent: " + cmd);
    }
    catch(err){

        log("❌ Send Error: " + err);
    }
}

/* KEYBOARD CONTROL */

document.addEventListener(
    "keydown",
    e=>{

        switch(e.key){

            case "ArrowUp":
                sendCommand("F");
                break;

            case "ArrowDown":
                sendCommand("B");
                break;

            case "ArrowLeft":
                sendCommand("L");
                break;

            case "ArrowRight":
                sendCommand("R");
                break;

            case " ":
            case "Enter":
                sendCommand("S");
                break;
        }
    }
);
</script>

</body>
</html>
