<!DOCTYPE html>
<html lang="uk">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEO COMMAND</title>

<style>
:root{
    --bg1:#3b4a1f;
    --bg2:#1f2a12;

    --panel:#1f2a12;
    --panel2:#2f3a17;

    --glass:rgba(25,35,12,.92);

    --text:#f3e7b3;

    --accent:#d6b65a;
    --accent2:#ffe08a;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:linear-gradient(135deg,var(--bg1),var(--bg2));
    color:var(--text);
    font-family:'Trebuchet MS',sans-serif;
    height:100vh;
    overflow:hidden;
}

/* TOP BAR */

.top-bar{
    position:fixed;
    top:0;
    left:0;
    width:100%;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:18px 25px;

    background:var(--glass);
    backdrop-filter:blur(10px);

    border-bottom:1px solid var(--accent);

    z-index:1000;
}

.brand h1{
    font-size:32px;
    background:linear-gradient(90deg,#ffde84,#f9dd8a);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.brand span{
    font-size:13px;
    opacity:.8;
}

/* MAIN GRID */

.main-layout{
    display:grid;
    grid-template-columns:320px 1fr;

    height:100vh;

    padding-top:95px;
    padding-left:15px;
    padding-right:15px;
    padding-bottom:15px;

    gap:15px;

    overflow:hidden;
}

/* LEFT PANEL */

.left-panel{
    display:grid;
    grid-template-rows:auto auto auto;
    gap:15px;
    height:100%;
    align-content:start;
}

/* CARDS */

.card{
    background:linear-gradient(135deg,var(--panel2),var(--panel));
    border:1px solid var(--accent);
    border-radius:14px;
    padding:12px;
}

.card h2{
    margin-bottom:8px;
    font-size:16px;
}

/* BUTTONS */

button{
    cursor:pointer;
    border:2px solid var(--accent);
    background:var(--panel);
    color:var(--text);
    border-radius:10px;
    padding:10px 12px;
    transition:.2s;
}

button:hover{
    border-color:var(--accent2);
    transform:translateY(-2px);
}

/* RANGE */

input[type="range"]{
    width:100%;
}

/* LOG */

#log{
    height:220px;          /* fixed height */
    max-height:220px;      /* does not exceed this */
    overflow-y:auto;       /* scroll inside the log only */

    font-family:monospace;

    border:1px solid var(--accent);
    border-radius:10px;

    padding:10px;

    background:rgba(0,0,0,.15);
}

/* RIGHT PANEL */

.right-panel{
    display:flex;
    justify-content:center;
    align-items:center;
}

/* CONTROLS */

.controls{
    width:90%;
    height:90%;

    display:grid;

    grid-template-areas:
        ". up ."
        "left stop right"
        ". down .";

    gap:20px;
}

.controls button{
    width:100%;
    height:100%;

    min-width:120px;
    min-height:120px;

    font-size:clamp(40px,5vw,70px);

    border:none;
    border-radius:22px;

    color:#222;

    background:linear-gradient(135deg,var(--accent),var(--accent2));

    box-shadow:0 5px 15px rgba(0,0,0,.3);
}

button[data-dir="up"]{grid-area:up;}
button[data-dir="left"]{grid-area:left;}
button[data-dir="right"]{grid-area:right;}
button[data-dir="down"]{grid-area:down;}
button[data-dir="stop"]{grid-area:stop;}

/* MOBILE */

@media(max-width:900px){
    body{
        overflow:auto;
    }

    .main-layout{
        grid-template-columns:1fr;
        grid-template-rows:auto 1fr;
        height:auto;
    }

    .controls{
        width:100%;
        height:400px;
    }
}
</style>
</head>

<body>

<header class="top-bar">
    <div class="brand">
        <h1>LEO COMMAND</h1>
        <span>ESP32 Robot Control Center</span>
    </div>
</header>

<div class="main-layout">

    <!-- LEFT -->
    <div class="left-panel">

        <div class="card">
            <h2>Connection</h2>
            <button onclick="connectSerial()">Connect Serial</button>
        </div>

        <div class="card">
            <h2>Speed</h2>
            <input type="range" min="0" max="9" value="5"
                onchange="sendCommand(this.value)">
        </div>

        <div class="card">
            <h2>Log</h2>
            <div id="log">READY</div>
        </div>

    </div>

    <!-- RIGHT -->
    <div class="right-panel">

        <div class="controls">

            <button data-dir="up" onclick="sendCommand('F')">↑</button>
            <button data-dir="left" onclick="sendCommand('L')">←</button>
            <button data-dir="stop" onclick="sendCommand('S')">■</button>
            <button data-dir="right" onclick="sendCommand('R')">→</button>
            <button data-dir="down" onclick="sendCommand('B')">↓</button>

        </div>

    </div>

</div>

<script>
let serialWriter = null;
let serialReader = null;

const encoder = new TextEncoder();
const decoder = new TextDecoder();

function log(msg){
    const el = document.getElementById("log");
    el.innerHTML = msg + "<br>" + el.innerHTML;
}

async function connectSerial(){
    try{
        const port = await navigator.serial.requestPort();
        await port.open({ baudRate:9600 });

        serialWriter = port.writable.getWriter();
        serialReader = port.readable.getReader();

        log("CONNECTED");

        while(true){
            const { value, done } = await serialReader.read();
            if(done) break;
            if(value){
                log(decoder.decode(value).trim());
            }
        }
    }catch(e){
        log("ERROR: " + e);
    }
}

async function sendCommand(cmd){
    if(!serialWriter){
        log("NOT CONNECTED");
        return;
    }

    await serialWriter.write(encoder.encode(cmd + "\n"));
    log("SEND: " + cmd);
}
</script>

</body>
</html>
