<!DOCTYPE html>
<html lang="uk">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEO COMMAND</title>

<style>
:root{
    --bg1:#3b4a1f;
    --bg2:#1f2a12;

    --panel:#1f2a12;
    --panel2:#2f3a17;

    --glass:rgba(25,35,12,.92);

    --text:#f3e7b3;

    --accent:#d6b65a;
    --accent2:#ffe08a;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    overflow:hidden;

    background:linear-gradient(135deg,var(--bg1),var(--bg2));
    color:var(--text);
    font-family:'Trebuchet MS',sans-serif;
}

/* TOP */

.top-bar{
    position:fixed;
    top:0;
    left:0;
    width:100%;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:18px 25px;

    background:var(--glass);
    backdrop-filter:blur(10px);

    border-bottom:1px solid var(--accent);
}

.brand h1{
    font-size:32px;
    background:linear-gradient(90deg,#ffde84,#f9dd8a);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

/* MAIN GRID */

.main-layout{
    display:grid;

    grid-template-columns:300px 1fr;

    height:100vh;

    padding-top:95px;
    padding-left:15px;
    padding-right:15px;
    padding-bottom:15px;

    gap:15px;

    overflow:hidden;
}

/* LEFT */

.left-panel{
    display:grid;

    grid-template-rows:auto auto 1fr;

    gap:15px;

    height:100%;
}

/* CARDS */

.card{
    background:linear-gradient(135deg,var(--panel2),var(--panel));
    border:1px solid var(--accent);
    border-radius:14px;
    padding:12px;
}

/* LOG PANEL FIX */

#log{
    height:100%;
    overflow-y:auto;   /* <-- KEY FIX */

    font-family:monospace;

    border:1px solid var(--accent);
    border-radius:10px;

    padding:10px;

    background:rgba(0,0,0,.15);
}

/* RIGHT */

.right-panel{
    display:flex;
    justify-content:center;
    align-items:center;
}

/* CONTROLS */

.controls{
    width:80%;   /* <-- YOU WANTED 80% */
    height:80%;

    display:grid;

    grid-template-areas:
        ". up ."
        "left stop right"
        ". down .";

    gap:18px;
}

.controls button{
    width:100%;
    height:100%;

    min-width:110px;
    min-height:110px;

    font-size:clamp(40px,5vw,70px);

    border:none;
    border-radius:20px;

    color:#222;

    background:linear-gradient(135deg,var(--accent),var(--accent2));

    box-shadow:0 5px 15px rgba(0,0,0,.3);

    transition:.2s;
}

.controls button:hover{
    transform:scale(1.06);
}

/* GRID AREAS */

button[data-dir="up"]{grid-area:up;}
button[data-dir="left"]{grid-area:left;}
button[data-dir="right"]{grid-area:right;}
button[data-dir="down"]{grid-area:down;}
button[data-dir="stop"]{grid-area:stop;}

/* MOBILE */

@media(max-width:900px){

    .main-layout{
        grid-template-columns:1fr;
        grid-template-rows:auto 1fr;
    }

    .controls{
        width:95%;
        height:400px;
    }
}
</style>
</head>

<body>

<header class="top-bar">
    <div class="brand">
        <h1>LEO COMMAND</h1>
        <span>ESP32 Robot Control Center</span>
    </div>

    <button onclick="connectSerial()">Connect</button>
</header>

<div class="main-layout">

    <!-- LEFT -->
    <div class="left-panel">

        <div class="card">
            <h2>Connection</h2>
            <button onclick="connectSerial()">ESP32</button>
        </div>

        <div class="card">
            <h2>Speed</h2>
            <input type="range" min="0" max="9" value="5"
                onchange="sendCommand(this.value)">
        </div>

        <div class="card">
            <h2>Log</h2>
            <div id="log">READY</div>
        </div>

    </div>

    <!-- RIGHT -->
    <div class="right-panel">

        <div class="controls">

            <button data-dir="up" onclick="sendCommand('F')">↑</button>
            <button data-dir="left" onclick="sendCommand('L')">←</button>
            <button data-dir="stop" onclick="sendCommand('S')">■</button>
            <button data-dir="right" onclick="sendCommand('R')">→</button>
            <button data-dir="down" onclick="sendCommand('B')">↓</button>

        </div>

    </div>

</div>

<script>
let writer = null;
let reader = null;

const enc = new TextEncoder();
const dec = new TextDecoder();

function log(msg){
    const l = document.getElementById("log");
    l.innerHTML = msg + "<br>" + l.innerHTML;
}

async function connectSerial(){
    try{
        const port = await navigator.serial.requestPort();
        await port.open({ baudRate:9600 });

        writer = port.writable.getWriter();
        reader = port.readable.getReader();

        log("CONNECTED");

        while(true){
            const { value, done } = await reader.read();
            if(done) break;
            if(value){
                log(dec.decode(value).trim());
            }
        }

    }catch(e){
        log("ERROR: " + e);
    }
}

async function sendCommand(c){
    if(!writer){
        log("NOT CONNECTED");
        return;
    }

    await writer.write(enc.encode(c + "\n"));
    log("SEND: " + c);
}
</script>

</body>
</html>
